<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Pengeluaran</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 15px;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 600px;
    }

    h2 {
        text-align: center;
    }

    input, select, button {
        width: 100%;
        padding: 12px;
        margin: 6px 0;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    table {
        width: 100%;
        margin-top: 10px;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 8px;
        border-bottom: 1px solid #ddd;
        text-align: center;
        font-size: 14px;
    }

    th {
        background: #4CAF50;
        color: white;
    }

    .aksi button {
        width: auto;
        padding: 5px 8px;
        margin: 0 2px;
        font-size: 12px;
    }

    .hapus {
        background: #e74c3c;
    }

    .total {
        margin-top: 10px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<div class="container">

<h2>Catatan Pengeluaran</h2>

<select id="user">
    <option value="">Pilih User</option>
    <option>Iqbal</option>
    <option>Gita</option>
</select>

<input type="date" id="tanggal">

<select id="kategori" onchange="updateJenis()">
    <option value="">Pilih Kategori</option>
    <option>Uang Masuk</option>
    <option>Uang Keluar</option>
</select>

<select id="jenis">
    <option value="">Pilih Jenis Transaksi</option>
</select>

<input type="number" id="jumlah" placeholder="Jumlah (Rp)">
<input type="text" id="keterangan" placeholder="Keterangan">

<button onclick="tambah()" id="btnSimpan">Tambah</button>

<table>
    <thead>
        <tr>
            <th>User</th>
            <th>Tgl</th>
            <th>Kategori</th>
            <th>Jenis</th>
            <th>Nominal</th>
            <th>Keterangan</th>
            <th>Aksi</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<div class="total" id="total">Total: Rp 0</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];
let editIndex = -1; // -1 = mode tambah, >=0 = mode edit

function updateJenis(selectedValue = "") {
    const kategori = document.getElementById("kategori").value;
    const jenisSelect = document.getElementById("jenis");

    jenisSelect.innerHTML = '<option value="">Pilih Jenis Transaksi</option>';

    let opsi = [];

    if (kategori === "Uang Masuk") {
        opsi = ["Gaji", "Other"];
    } else if (kategori === "Uang Keluar") {
        opsi = [
            "Jajan","Dapur","Tagihan","Anak","Orang Tua",
            "Transport","Kebutuhan & Hiburan","Nabung","Other"
        ];
    }

    opsi.forEach(teks => {
        let opt = document.createElement("option");
        opt.value = teks;
        opt.textContent = teks;
        if (teks === selectedValue) opt.selected = true;
        jenisSelect.appendChild(opt);
    });
}

function render() {
    let list = document.getElementById("list");
    list.innerHTML = "";
    let total = 0;

    data.forEach((d, i) => {
        let row = document.createElement("tr");
        row.innerHTML = `
            <td>${d.user}</td>
            <td>${d.tgl}</td>
            <td>${d.kat}</td>
            <td>${d.jenis}</td>
            <td>${d.jml.toLocaleString("id-ID")}</td>
            <td>${d.ket}</td>
            <td class="aksi">
                <button onclick="editData(${i})">Edit</button>
                <button class="hapus" onclick="hapusData(${i})">Hapus</button>
            </td>
        `;
        list.appendChild(row);

        // INI BAGIAN PENTINGNYA
        if (d.kat === "Uang Masuk") {
            total += d.jml;
        } else if (d.kat === "Uang Keluar") {
            total -= d.jml;
        }
    });

    document.getElementById("total").innerText =
        "Saldo: Rp " + total.toLocaleString("id-ID");
}


function tambah() {
    let usr = document.getElementById("user").value;
    let tgl = document.getElementById("tanggal").value;
    let kat = document.getElementById("kategori").value;
    let jns = document.getElementById("jenis").value;
    let jml = parseInt(document.getElementById("jumlah").value);
    let ket = document.getElementById("keterangan").value;

    if (!usr || !tgl || !kat || !jns || !jml || !ket) {
        alert("Lengkapi data!");
        return;
    }

    let obj = { user: usr, tgl, kat, jenis: jns, jml, ket };

    if (editIndex === -1) {
        data.push(obj);            // tambah baru
    } else {
        data[editIndex] = obj;     // update data lama
        editIndex = -1;
        document.getElementById("btnSimpan").innerText = "Tambah";
    }

    localStorage.setItem("data", JSON.stringify(data));
    render();
    resetForm();
}

function editData(i) {
    let d = data[i];
    editIndex = i;

    document.getElementById("user").value = d.user;
    document.getElementById("tanggal").value = d.tgl;
    document.getElementById("kategori").value = d.kat;

    updateJenis(d.jenis); // isi jenis sesuai kategori lalu pilih nilainya

    document.getElementById("jumlah").value = d.jml;
    document.getElementById("keterangan").value = d.ket;

    document.getElementById("btnSimpan").innerText = "Simpan Perubahan";
}

function hapusData(i) {
    if (confirm("Hapus transaksi ini?")) {
        data.splice(i, 1);
        localStorage.setItem("data", JSON.stringify(data));
        render();
        resetForm();
    }
}

function resetForm() {
    document.getElementById("user").value = "";
    document.getElementById("tanggal").value = "";
    document.getElementById("kategori").value = "";
    document.getElementById("jenis").innerHTML =
        '<option value="">Pilih Jenis Transaksi</option>';
    document.getElementById("jumlah").value = "";
    document.getElementById("keterangan").value = "";
    editIndex = -1;
    document.getElementById("btnSimpan").innerText = "Tambah";
}

render();
</script>

</body>
</html>
