<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Pengeluaran</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4CAF50">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        padding: 15px;
        display: flex;
        justify-content: center; /* center horizontal */
    }

    .container {
        width: 100%;
        max-width: 500px; /* biar rapi di tengah */
    }

    h2 {
        text-align: center;
    }

    input, select, button {
        width: 100%;
        padding: 12px;
        margin: 6px 0;
        font-size: 16px;
        box-sizing: border-box;
    }

    button {
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    table {
        width: 100%;
        margin-top: 10px;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        padding: 8px;
        border-bottom: 1px solid #ddd;
        text-align: center;
        font-size: 14px;
    }

    th {
        background: #4CAF50;
        color: white;
    }

    .total {
        margin-top: 10px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<div class="container">

<h2>Catatan Pengeluaran</h2>

<select id="user">
    <option value="">Pilih User</option>
    <option>Iqbal</option>
    <option>Admin</option>
    <option>Kasir</option>
</select>

<input type="date" id="tanggal">

<select id="kategori">
    <option value="">Pilih Kategori</option>
    <option>Makan</option>
    <option>Transport</option>
    <option>Belanja</option>
    <option>Lainnya</option>
</select>

<select id="jenis">
    <option value="">Pilih Jenis Pembayaran</option>
    <option>Tunai</option>
    <option>Transfer</option>
    <option>Debit</option>
    <option>QRIS</option>
</select>

<input type="number" id="jumlah" placeholder="Jumlah (Rp)">

<input type="text" id="keterangan" placeholder="Keterangan">
<button onclick="tambah()">Tambah</button>

<table>
    <thead>
        <tr>
            <th>User</th>
            <th>Tgl</th>
            <th>Kategori</th>
            <th>Jenis</th>
            <th>Rp</th>
            <th>Keterangan</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<div class="total" id="total">Total: Rp 0</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("data")) || [];

function render() {
    let list = document.getElementById("list");
    list.innerHTML = "";
    let total = 0;

    data.forEach(d => {
        let row = document.createElement("tr");

        row.innerHTML = `
            <td>${d.tgl}</td>
            <td>${d.user}</td>
            <td>${d.ket}</td>
            <td>${d.kat}</td>
            <td>${d.jenis}</td>
            <td>${d.jml.toLocaleString()}</td>
        `;

        list.appendChild(row);
        total += d.jml;
    });

    document.getElementById("total").innerText =
        "Total: Rp " + total.toLocaleString("id-ID");
}

function tambah() {
    let tgl = document.getElementById("tanggal").value;
    let usr = document.getElementById("user").value;
    let ket = document.getElementById("keterangan").value;
    let kat = document.getElementById("kategori").value;
    let jns = document.getElementById("jenis").value;
    let jml = parseInt(document.getElementById("jumlah").value);

    if (!tgl || !usr || !ket || !kat || !jns || !jml) {
        alert("Lengkapi data!");
        return;
    }

    data.push({
        tgl: tgl,
        user: usr,
        ket: ket,
        kat: kat,
        jenis: jns,
        jml: jml
    });

    localStorage.setItem("data", JSON.stringify(data));
    render();

    // reset input
    document.getElementById("tanggal").value = "";
    document.getElementById("user").value = "";
    document.getElementById("keterangan").value = "";
    document.getElementById("kategori").value = "";
    document.getElementById("jenis").value = "";
    document.getElementById("jumlah").value = "";
}

// daftar service worker (opsional PWA)
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}

// tampilkan data saat pertama kali dibuka
render();
</script>

</body>
</html>
